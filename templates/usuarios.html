<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios — Bingo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
}
.field {
  width: 100%;
  border-radius: 0.75rem;
  border: 1px solid #e2e8f0;
  padding: 0.6rem 0.85rem;
  font-weight: 600;
  color: #1e293b;
}
.field:focus { outline: none; box-shadow: 0 0 0 2px #22d3ee; }
</style>
</head>
<body class="py-8 px-4">
<main class="bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl p-6 w-full max-w-3xl mx-auto">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-teal-400">
      Usuarios
    </h1>
    <a href="/" class="text-sm font-bold text-indigo-700 underline">Volver al bingo</a>
  </div>

  <section class="mb-8 p-4 rounded-2xl bg-slate-50 border border-slate-200">
    <h2 class="font-extrabold text-slate-800 mb-3">Crear usuario</h2>
    <form id="createForm" class="grid gap-3 sm:grid-cols-2">
      <input id="newUsername" class="field" placeholder="usuario" required autocomplete="off" />
      <input id="newPassword" class="field" type="password" placeholder="contraseña (mín. 6)" required minlength="6" />
      <select id="newRole" class="field">
        <option value="operador">operador</option>
        <option value="admin">admin</option>
      </select>
      <button type="submit" class="bg-gradient-to-r from-cyan-400 to-blue-500 text-white font-bold rounded-xl px-4 py-2">
        Crear
      </button>
    </form>
    <p id="createMsg" class="hidden mt-2 text-sm font-semibold"></p>
  </section>

  <section>
    <h2 class="font-extrabold text-slate-800 mb-3">Listado</h2>
    <div id="userList" class="space-y-3"></div>
  </section>
</main>
<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/usuarios.js?v=1"></script>
</body>
</html>
