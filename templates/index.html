<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Bolillero (90)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="icon" type="image/png" href="/static/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Estilos CSS */
html, body {
  height: 100%;
}

body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  overflow-x: hidden;
  min-height: 100dvh;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in { animation: fadeIn 0.4s ease-in-out; }

.bingo-shell {
  width: min(96vw, 72rem);
  max-height: min(96dvh, 100%);
  overflow: auto;
  padding: clamp(0.75rem, 2vw, 2rem);
}

.bingo-title {
  font-size: clamp(1.75rem, 5vw, 3rem);
  margin-bottom: clamp(0.5rem, 1.5vh, 1.5rem);
}

.bingo-grid {
  display: grid;
  gap: clamp(0.75rem, 2vw, 1.25rem);
  align-items: start;
  grid-template-columns: 1fr;
}

@media (min-width: 900px) {
  .bingo-grid {
    grid-template-columns: minmax(10rem, 14rem) minmax(0, 1fr) minmax(10rem, 14rem);
    align-items: stretch;
  }
}

.bingo-side-right {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

@media (min-width: 900px) {
  .bingo-side-right {
    min-height: min(78dvh, 40rem);
  }
}

#ultimasBolillas {
  flex: 1;
  align-content: start;
  min-height: min(55dvh, 28rem);
  max-height: min(78dvh, 40rem);
  overflow: auto;
}

.bingo-logo {
  width: clamp(6rem, 18vw, 13rem);
  height: auto;
  margin-inline: auto;
}

.bingo-actions {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

.bingo-btn {
  padding: clamp(0.65rem, 1.4vh, 0.85rem) 1rem;
  font-size: clamp(0.85rem, 1.8vw, 1rem);
  border-radius: 1rem;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.bingo-btn:hover { transform: scale(1.03); }

#canvasContainer {
  width: min(72vw, 42vh, 320px);
  height: min(72vw, 42vh, 320px);
  margin: 0 auto;
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
}

#bolillaCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

.numero-modal {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 8cm;
  height: 8cm;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20;
  pointer-events: none;
  background: rgba(15, 23, 42, 0.45);
  border-radius: 50%;
  box-sizing: border-box;
}

.numero-modal.is-open {
  display: flex;
}

.numero-modal__valor {
  font-size: 4.4cm;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.04em;
  color: #fff;
  text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
}

.bolilla-pequena {
  width: clamp(2.25rem, 5vw, 3.1rem);
  height: clamp(2.25rem, 5vw, 3.1rem);
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fff, #ff6b6b, #c92a2a);
  box-shadow:
    0 4px 10px rgba(0,0,0,0.3),
    inset 0 -4px 8px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(0.85rem, 2vw, 1.15rem);
  font-weight: 800;
  color: white;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
  margin: 2px;
  animation: fadeIn 0.5s ease-in-out;
}

#resultado {
  background: linear-gradient(to right, #2563eb, #22d3ee);
  padding: clamp(0.75rem, 2vh, 1.5rem) clamp(1rem, 3vw, 2rem);
  border-radius: 1.5rem;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  font-size: clamp(2rem, 6vw, 3rem);
  margin-top: clamp(0.75rem, 2vh, 1.5rem);
}

.toast {
  border-radius: 1rem;
  backdrop-filter: blur(4px);
  opacity: 0.95;
}

.btn-bingo {
  background: linear-gradient(to right, #f093fb, #f5576c);
  box-shadow: 0 8px 15px rgba(0,0,0,0.3);
}

.btn-iniciar {
  background: linear-gradient(to right, #4facfe, #00f2fe);
  box-shadow: 0 8px 15px rgba(0,0,0,0.3);
}

.contador {
  font-size: clamp(0.95rem, 2.2vw, 1.2rem);
  font-weight: 700;
  color: white;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  margin-bottom: clamp(0.5rem, 1.5vh, 1.25rem);
}

.ultimas-title {
  font-size: clamp(1.15rem, 2.5vw, 1.5rem);
  flex-shrink: 0;
}

.visor-share {
  margin-top: 0.35rem;
  padding: 0.65rem 0.5rem;
  border-radius: 1rem;
  background: linear-gradient(180deg, rgba(99, 102, 241, 0.12), rgba(99, 102, 241, 0.04));
  border: 1px solid rgba(99, 102, 241, 0.25);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.45rem;
}

.visor-share__label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #4338ca;
}

.visor-share__qr {
  width: 120px;
  height: 120px;
  background: #fff;
  border-radius: 0.65rem;
  padding: 4px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
}

.visor-share__qr img,
.visor-share__qr canvas {
  display: block;
  width: 112px !important;
  height: 112px !important;
}

.visor-share__link {
  font-size: 0.78rem;
  font-weight: 700;
  color: #3730a3;
  text-decoration: underline;
  text-underline-offset: 2px;
  word-break: break-all;
  line-height: 1.25;
}
</style>
</head>
<body class="min-h-[100dvh] flex items-center justify-center py-2 px-2 sm:py-4">

<main class="bingo-shell bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl w-full fade-in text-center">
  <div class="bingo-grid">

  <!-- Columna izquierda: logo a la altura de BINGO -->
  <div class="bingo-actions w-full">
    <div class="text-center">
      <img src="/static/logo.png" alt="Logo" class="bingo-logo opacity-90">
    </div>

    <button id="iniciarBtn" class="bingo-btn btn-iniciar">
      🔄 <span>Iniciar Bingo</span>
    </button>

    <button id="verBolillasBtn" class="bingo-btn bg-gradient-to-r from-green-400 to-blue-500">
      👁️ <span>Ver Bolillas</span>
    </button>

    <button id="sacarBtn" class="bingo-btn btn-bingo">
      🎱 <span>Sacar Bolilla</span>
    </button>

    <a href="/configuracion" class="bingo-btn bg-slate-700/90 hover:bg-slate-800">
      ⚙️ <span>Configuración</span>
    </a>

    <a id="usuariosNav" href="/usuarios" class="bingo-btn bg-indigo-700/90 hover:bg-indigo-800 hidden">
      👥 <span>Usuarios</span>
    </a>

    <button id="logoutBtn" type="button" class="bingo-btn bg-slate-500/90 hover:bg-slate-600">
      🚪 <span>Salir</span>
    </button>

    <p id="sessionUser" class="text-xs font-semibold text-slate-600 text-center"></p>

    <div class="visor-share" aria-label="Abrir visor en otro dispositivo">
      <p class="visor-share__label">Visor móvil</p>
      <div id="visorQr" class="visor-share__qr" role="img" aria-label="Código QR al visor de producción"></div>
      <a
        id="visorLink"
        class="visor-share__link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      ></a>
    </div>
  </div>

  <!-- Columna central -->
  <div class="flex flex-col items-center justify-start w-full min-w-0">
    <h1 class="bingo-title font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-teal-400">
      BINGO
    </h1>

    <div class="contador bg-gradient-to-r from-blue-600 to-cyan-400 py-2 px-4 rounded-xl inline-block">
      <span id="contadorBolillas">Bolillas restantes: 90</span>
    </div>

    <div id="canvasContainer">
      <canvas id="bolillaCanvas"></canvas>
      <div id="numeroModal" class="numero-modal" aria-live="polite" aria-hidden="true">
        <span id="numeroModalValor" class="numero-modal__valor"></span>
      </div>
    </div>

    <div id="resultado" class="font-bold text-white hidden"></div>
  </div>

  <!-- Columna derecha: más alta, últimas arriba -->
  <div class="bingo-side-right w-full min-w-0">
    <h3 class="ultimas-title font-extrabold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-teal-400">Últimas:</h3>
    <div id="ultimasBolillas" class="grid grid-cols-4 sm:grid-cols-3 md:grid-cols-2 justify-items-center gap-1 bg-gradient-to-r from-purple-100 to-pink-100 rounded-2xl shadow-inner p-2">
    </div>
  </div>

</div>
</main>

<div aria-live="polite" aria-atomic="true" class="position-fixed top-0 end-0 p-3" style="z-index:1050; width:300px;">
  <div id="toastContainer" class="toast-container"></div>
</div>

<div id="popupBolillas" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
  <div class="bg-white rounded-2xl p-6 w-full max-w-3xl max-h-[80vh] overflow-auto relative">
    <button id="cerrarPopup" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800 font-bold text-2xl">&times;</button>
    <h3 class="text-2xl font-bold mb-6 text-center text-purple-600">Todas las Bolillas Salidas</h3>
    <div id="todasBolillas" class="flex flex-wrap justify-center gap-3"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/config-store.js?v=4"></script>
<script src="/static/js/visor-qr.js?v=2"></script>
<script src="/static/js/main.js?v=12"></script>
</body>
</html>
