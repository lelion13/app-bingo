<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Bingo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
}
.field {
  width: 100%;
  border-radius: 1rem;
  border: 1px solid #e2e8f0;
  padding: 0.75rem 1rem;
  font-size: 1.05rem;
  font-weight: 600;
  color: #1e293b;
}
.field:focus {
  outline: none;
  box-shadow: 0 0 0 2px #22d3ee;
}
.btn-login {
  background: linear-gradient(to right, #4facfe, #00f2fe);
  box-shadow: 0 8px 15px rgba(0,0,0,0.25);
}
</style>
</head>
<body class="flex items-center justify-center py-10 px-4">
<main class="bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl p-8 w-full max-w-md">
  <h1 class="text-4xl font-extrabold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-teal-400 text-center">
    Bingo
  </h1>
  <p class="text-slate-600 text-center mb-8 text-sm">Ingresá para operar tu bolillero</p>

  <form id="loginForm" class="space-y-4">
    <div>
      <label for="username" class="block text-left text-slate-800 font-bold mb-2">Usuario</label>
      <input id="username" name="username" autocomplete="username" required class="field" />
    </div>
    <div>
      <label for="password" class="block text-left text-slate-800 font-bold mb-2">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required class="field" />
    </div>
    <p id="errorMsg" class="hidden text-center text-sm font-semibold text-rose-600"></p>
    <button type="submit" class="btn-login text-white w-full px-4 py-3 rounded-2xl font-bold">
      Ingresar
    </button>
  </form>
</main>
<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/login.js?v=1"></script>
</body>
</html>
